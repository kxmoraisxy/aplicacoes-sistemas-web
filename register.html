<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
    <title>EcoRide - Register</title>
 
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <!--Stylesheet-->
    <style media="screen">
      *,
*:before,
*:after{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
body{
    background-image: url("images/natureBackground.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
}
.background{
    width: 430px;
    height: 520px;
    position: absolute;
    transform: translate(-50%,-50%);
    left: 50%;
    top: 50%;
}

.shape:first-child{
    background: linear-gradient(
        #1845ad,
        #23a2f6
    );
    left: -80px;
    top: -80px;
}
.shape:last-child{
    background: linear-gradient(
        to right,
        #ff512f,
        #f09819
    );
    right: -30px;
    bottom: -80px;
}
form{
    height: auto;
    width: 400px;
    background-color: rgba(255,255,255,0.13);
    position: absolute;
    transform: translate(-50%,-50%);
    top: 50%;
    left: 50%;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(8,7,16,0.6);
    padding: 50px 35px;
}
form *{
    font-family: 'Poppins',sans-serif;
    color: #ffffff;
    letter-spacing: 0.5px;
    outline: none;
    border: none;
}
form h3{
    font-size: 32px;
    font-weight: 500;
    line-height: 42px;
    text-align: center;
}

label{
    display: block;
    margin-top: 20px;
    font-size: 16px;
    font-weight: 500;
}
input{
    display: block;
    height: 50px;
    width: 100%;
    background-color: rgba(255,255,255,0.07);
    border-radius: 3px;
    padding: 0 10px;
    margin-top: 8px;
    font-size: 14px;
    font-weight: 300;
}
::placeholder{
    color: #e5e5e5;
}
button{
    margin-top: 30px;
    width: 100%;
    background-color: #ffffff;
    color: #080710;
    padding: 15px 0;
    font-size: 18px;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
}
.social{
  margin-top: 20px;
  display: flex;
}
.social div{
  background: red;
  width: 150px;
  border-radius: 3px;
  padding: 5px 10px 10px 5px;
  background-color: rgba(255,255,255,0.27);
  color: #eaf0fb;
  text-align: center;
}
.social div:hover{
  background-color: rgba(255,255,255,0.47);
}
.social .fb{
  margin-left: 25px;
}
.social i{
  margin-right: 4px;
}

.login-link {
  margin-top: 15px;
  text-align: center;
}

.login-link a {
  color: #e5e5e5;
  text-decoration: none;
}

.login-link a:hover {
  text-decoration: underline;
}

select {
  display: block;
  height: 50px;
  width: 100%;
  background-color: rgba(255,255,255,0.07);
  border-radius: 3px;
  padding: 0 10px;
  margin-top: 8px;
  font-size: 14px;
  font-weight: 300;
  color: #e5e5e5;
}

option {
  background-color: #080710;
  color: #e5e5e5;
}
    </style>
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form id="signup-form" action="./php/register.php" method="POST">
        <h3>Register</h3>

        <label for="signup-name">Name</label>
        <input id="signup-name" name="name" type="text" placeholder="Full name" required>
        
        <label for="signup-phone">Phone Number</label>
        <input id="signup-phone" name="phone" type="tel" pattern="[0-9]{9}" placeholder="9 digits" required>
        
        <label for="signup-nif">NIF</label>
        <input id="signup-nif" name="nif" type="text" pattern="[0-9]{9}" placeholder="9 digits" required>
        
        <label for="signup-email">E-mail</label>
        <input id="signup-email" name="email" type="email" placeholder="name@example.com" required>
        
        <label for="signup-password">Password</label>
        <input id="signup-password" name="password" type="password" placeholder="Create password" required>
        
        <label for="signup-password-confirm">Confirm password</label>
        <input id="signup-password-confirm" name="password-confirm" type="password" placeholder="Repeat password" required>
        
        <label for="signup-type">User Type</label>
        <select id="signup-type" name="tipo_usuario" required>
          <option value="" disabled selected>Select user type</option>
          <option value="passageiro">Passenger</option>
          <option value="condutor">Driver</option>
        </select>

        <button type="submit">Register</button>
        
        <div class="login-link">
          <a href="login.html">Already have an account? Login</a>
        </div>
    </form>
    <script src="scripts/register2.js"></script>
</body>
</html>
